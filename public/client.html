<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0a0c14">
<title>RESONANCE · 大千</title>
<style>
  :root { --bg:#0a0c14; --text:#e6e9f2; --muted:#8a93ad; --line:#232a40; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; background:var(--bg); color:var(--text); font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif; height:100%; overflow:hidden; overscroll-behavior:none; }
  body { padding: max(12px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:10px; height:100dvh; }
  header { display:flex; justify-content:space-between; align-items:baseline; }
  h1 { font-size:13px; letter-spacing:.35em; margin:0; font-weight:600; }
  h1 small { display:block; letter-spacing:.08em; font-size:11px; font-weight:400; color:var(--muted); margin-top:2px; }
  #status { font-size:12px; color:var(--muted); }
  #status.bad { color:#ef8a7a; }
  #beats { display:flex; gap:8px; justify-content:center; }
  #beats i { width:10px; height:10px; border-radius:50%; background:#262d45; transition: background .08s, transform .08s; }
  #beats i.on { background:#dfe6ff; transform:scale(1.3); }
  /* grid fills the screen (no page scroll) */
  #grid { flex:1; min-height:0; display:flex; flex-direction:column; gap:12px; }
  .grp { flex:1 1 0; min-height:0; display:flex; flex-direction:column; gap:6px; }
  .gh { display:flex; justify-content:space-between; align-items:baseline; gap:10px; font-size:11px; letter-spacing:.1em; text-transform:uppercase; color:var(--muted); white-space:nowrap; }
  .gh span { text-transform:none; letter-spacing:0; overflow:hidden; text-overflow:ellipsis; opacity:.8; }
  .gg { flex:1; min-height:0; display:grid; gap:10px; grid-auto-rows:1fr; }
  .pad.locked, .pad.spent { opacity:.45; }
  .pad[data-wait] .st { color:var(--c); }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); background:#1b2136; border:1px solid #3a4468; color:#e8ecff; padding:9px 14px; border-radius:12px; font-size:13px; z-index:1100; opacity:0; pointer-events:none; transition:opacity .2s; max-width:90%; text-align:center; }
  #toast.on { opacity:1; }
  .pad { position:relative; overflow:hidden; border-radius:16px; border:2px solid color-mix(in srgb, var(--c) 45%, transparent);
         background: color-mix(in srgb, var(--c) 8%, #0e1120); color:var(--text); padding:10px 12px; text-align:left;
         display:flex; flex-direction:column; justify-content:flex-end; cursor:pointer; user-select:none; -webkit-user-select:none;
         touch-action:none; transition: background .25s, box-shadow .25s, transform .08s; min-height:0; }
  .pad.pressed { transform:scale(.97); }
  #finaleBanner { position:fixed; left:0; right:0; bottom:0; z-index:20; padding:18px 16px calc(18px + env(safe-area-inset-bottom)); text-align:center; font-size:20px; letter-spacing:.08em; background:linear-gradient(transparent, rgba(0,0,0,.85) 40%); opacity:0; pointer-events:none; transition:opacity 2s; }
  body.finale #finaleBanner { opacity:1; }
  body.finale #grid .pad { pointer-events:none; opacity:.45; transition:opacity 4s; }
  .pad .name { position:relative; z-index:1; font-size:18px; font-weight:650; line-height:1.15; }
  .pad .role { position:relative; z-index:1; font-size:11px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .pad .st { position:absolute; z-index:1; top:8px; right:10px; font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); font-variant-numeric:tabular-nums; }
  .pad[data-state=playing] { background: color-mix(in srgb, var(--c) 50%, #0e1120); box-shadow: 0 0 24px color-mix(in srgb, var(--c) 50%, transparent); border-color:var(--c); }
  .pad[data-state=playing] .role, .pad[data-state=playing] .st { color: rgba(255,255,255,.85); }
  .pad[data-state=starting], .pad[data-state=stopping] { animation: pend .43s infinite alternate; border-color:var(--c); }
  @keyframes pend { from { background: color-mix(in srgb, var(--c) 35%, #0e1120); } to { background: color-mix(in srgb, var(--c) 10%, #0e1120); } }
  footer { text-align:center; color:var(--muted); font-size:11px; line-height:1.35; }
</style>
</head>
<body>
  <header><h1>RESONANCE<small id="packname"></small></h1><span id="status" class="bad">connecting…</span></header>
  <div id="beats"></div>
  <div id="grid"></div>
  <div id="toast"></div>
  <div id="finaleBanner">The gong has sounded · thank you</div>
  <footer><b>Tap</b> a layer to play with it: ↔ complexity, ↕ filter, a fader for volume, and a button to bring it in or out (joins on the next beat)</footer>
<script>
/* If anything on this page fails to load or run (an old browser, a blocked file), say so in the status line instead of staying on "connecting…". Plain old syntax on purpose. */
window.addEventListener('error', function (e) {
  var el = document.getElementById('status'); if (!el) return;
  var t = e.target && (e.target.src || e.target.href);
  el.textContent = t ? 'could not load ' + String(t).split('/').pop() : 'page error: ' + (e.message || 'unknown') + (e.lineno ? ' (line ' + e.lineno + ')' : '');
  el.className = 'bad';
}, true);
</script>
<script src="xy.js"></script>
<script src="roll.js"></script>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const XY = ResonanceXY;
  let cfg = null, state = { active: [], playing: [], engine: false, clients: 0 }, ws;
  const xyState = {};           // id -> {x: complexity, y: cutoff, v: volume}
  const TAP_SLOP = 10;

  const sendMsg = (m) => ws && ws.readyState === 1 && ws.send(JSON.stringify(m));
  const sheet = XY.createSheet({
    send: sendMsg,
    onToggle: (id) => { sendMsg({ type: 'toggle', stem: id }); answerTap(id); },
    closeLabel: '×',
    onLocal: (id, p) => { xyState[id] = p; },
    rollView: (id) => rollViewFor(id),
  });

  // ---- The piano roll in the pad sheet: the notes come from the engine (once per render), the beat clock from its ticks ----
  const rolls = {};            // stem id -> { beats, notes }
  const sched = {};            // stem id -> the beat where a layer that was just switched on comes in (sent by the engine)
  const estStart = {};         // stem id -> our own estimate of that, until the engine tells us
  const clock = { n: null, at: 0, bpm: 60 };
  const beatMs = () => 60000 / (clock.bpm || 60);
  function beatPos() { // the beat now, between ticks by the local clock, nudged toward each tick; it stops if the ticks stop
    if (clock.n === null) return null;
    return clock.n + Math.min((performance.now() - clock.at) / beatMs(), 1.5);
  }
  const clockLive = () => clock.n !== null && performance.now() - clock.at < beatMs() * 3 + 500;
  function onTick(m) {
    if (m.n == null) return;
    const now = performance.now(), pred = beatPos();
    if (m.bpm) clock.bpm = m.bpm;
    clock.n = pred !== null && Math.abs(m.n - pred) < 0.35 && clockLive() ? pred + 0.25 * (m.n - pred) : m.n; clock.at = now; // small differences are smoothed, big ones (a new tempo, a restart) snap
  }
  function quantUnitBeats() {
    const bpb = (cfg && cfg.beatsPerBar) || 4, q = (state.params && state.params.quantizeBar) || (cfg && cfg.quantize === 'bar' ? 1 : cfg && cfg.quantize === 'half' ? 0.5 : 1 / bpb);
    return q * bpb;
  }
  function rollViewFor(id) {
    const r = rolls[id], sd = cfg && cfg.stems.find((x) => x.id === id); if (!r || !sd) return null;
    const pos = beatPos(), live = pos !== null && clockLive(), on = new Set(state.active).has(id), sounding = new Set(state.playing).has(id), bpb = cfg.beatsPerBar || 4;
    const xy = xyState[id] || XY.XY_DEFAULT;
    let mode = 'off', start = null, label = 'Off';
    if (!live || !state.engine) { mode = 'idle'; label = on ? 'Waiting for the show' : 'Preview'; }
    else if (sounding) { mode = 'playing'; label = on ? 'Playing' : 'Fading out'; delete sched[id]; delete estStart[id]; }
    else if (on) {
      mode = 'waiting';
      let s = sched[id]; if (s != null && s < pos - 1) s = null;
      if (s == null) { if (estStart[id] == null || estStart[id] < pos - 1) { const u = quantUnitBeats(); estStart[id] = (Math.floor((pos + 0.15) / u) + 1) * u; } s = estStart[id]; }
      start = s; const left = Math.max(0, s - pos);
      label = left < 1 ? 'Starting' : `Starts in ${Math.ceil(left)} beat${Math.ceil(left) > 1 ? 's' : ''}`;
    } else { delete sched[id]; delete estStart[id]; }
    return { notes: r.notes, beats: r.beats, pos: pos === null ? 0 : pos, bpb, color: sd.color || '#8fb8ff', mode, start, label, gains: sd.complexity ? [1, XY.layerGain(xy.x, 0), XY.layerGain(xy.x, 1)] : [1, 0, 0] };
  }

  function onXY(id, p) {
    xyState[id] = { x: p.x ?? XY.XY_DEFAULT.x, y: p.y ?? XY.XY_DEFAULT.y, v: p.v ?? XY.XY_DEFAULT.v };
    sheet.update(id, xyState[id]);
  }

  let hung = false;
  function connect() {
    ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?role=client`);
    const mine = ws; /* a handshake that never completes (some tablets and Wi-Fi setups) is dropped after 6 s and tried again, saying so */
    setTimeout(() => { if (mine === ws && mine.readyState === 0) { hung = true; try { mine.close(); } catch (e) { /* already closed */ } status(); } }, 6000);
    ws.onopen = () => { hung = false; status(); };
    ws.onclose = () => { status(); setTimeout(connect, 1000); };
    ws.onmessage = (e) => {
      const m = JSON.parse(e.data);
      if (m.type === 'config') {
        if (cfg && cfg.pack && m.pack && cfg.pack.id !== m.pack.id) { // pack switched: forget the old pads
          for (const k of Object.keys(xyState)) delete xyState[k];
          for (const o of [rolls, sched, estStart]) for (const k of Object.keys(o)) delete o[k];
          sheet.close();
        }
        if (cfg && m.build && cfg.build && m.build !== cfg.build) { location.reload(); return; } // the app was updated: pick up the new page
        cfg = m; $('#packname').textContent = m.pack ? m.pack.name : ''; build();
      }
      else if (m.type === 'denied') { toast(m.reason); syncSheet(); }
      else if (m.type === 'state') {
        state = m; render(); status();
        if (m.xy) for (const [id, p] of Object.entries(m.xy)) onXY(Number(id), p);
      }
      else if (m.type === 'xy') onXY(m.stem, m);
      else if (m.type === 'tick') { beat(m); onTick(m); }
      else if (m.type === 'notes') rolls[m.stem] = m;
      else if (m.type === 'sched') Object.assign(sched, m.at);
    };
  }

  function status() {
    const el = $('#status');
    if (!ws || ws.readyState !== 1) { el.textContent = hung ? 'cannot reach ' + location.host + ', retrying…' : 'reconnecting…'; el.className = 'bad'; return; }
    if (!state.engine) { el.textContent = 'waiting for engine'; el.className = 'bad'; return; }
    el.textContent = `live · ${state.clients} connected`; el.className = '';
  }

  // Pick the column count whose cells come closest to a comfortable pad shape.
  function layout() {
    if (!cfg) return;
    document.querySelectorAll('.gg').forEach((g) => {
      const n = g.children.length, W = g.clientWidth, H = g.clientHeight, gap = 10;
      let best = Math.min(2, n), bestScore = Infinity;
      for (let c = 1; c <= Math.min(n, 8); c++) {
        const r = Math.ceil(n / c), cw = (W - gap * (c - 1)) / c, ch = (H - gap * (r - 1)) / r;
        if (cw < 90 || ch < 56) continue;
        const score = Math.abs(Math.log((cw / ch) / 1.1)) + (r * c - n) * 0.05;
        if (score < bestScore) { bestScore = score; best = c; }
      }
      g.style.gridTemplateColumns = `repeat(${best}, 1fr)`;
    });
  }
  addEventListener('resize', layout);

  // Plain-language text shown over the pad: what the sound is, what the pad does, and how joining in works (from the group's rules).
  const rulesOfDef = (def) => { const g = (cfg.groups || []).find((x) => x.id === def.group); return { g, r: (g && g.rules) || {} }; };
  function infoFor(def) {
    const { g, r } = rulesOfDef(def);
    /* Layers that need a group vote (the nature samples, the gong) get no pad and no switch: the card with the explanation and a Vote button. The gong has no volume bar either. */
    const vote = !!(r.gate || r.finale), noPad = vote, noFader = r.xy === false;
    const tone = 'Up and down changes the tone: bright and clear at the top, dark and muffled at the bottom.';
    const slide = noPad ? '' : def.complexity
      ? `Drag on this pad. Left and right changes how busy it is: far left plays just a few notes, far right adds more and more. ${tone} The bar on the right is the volume.`
      : `Drag on this pad. ${tone} The bar on the right is the volume. (This sound has no "busy" setting.)`;
    let join;
    if (r.finale) { const n = r.gate ? r.gate.participants : 1, w = r.gate ? r.gate.window : 10;
      join = n > 1 ? `This is the end-of-the-show button. When ${n} people press Vote within ${w} seconds of each other, the gong rings three times and all the music fades away. You will see how many have joined.`
        : 'This is the end-of-the-show button. Press Vote and the gong rings three times while all the music fades away.'; }
    else {
      const parts = [];
      if (r.gate) parts.push(`This one needs teamwork: it only starts when ${r.gate.participants} people press Vote within ${r.gate.window} seconds of each other. Until then you will see how many have joined. Once it is playing, press Stop to bring it back out.`);
      else parts.push('Anyone can bring this in or out whenever they like.');
      if (r.maxActive) parts.push(r.maxActive === 1 ? 'Only one sound from this group plays at a time' + (r.onFull === 'ignore' ? ', so if one is playing your press is ignored.' : ': a new one takes over from the one that has been playing longest.')
        : `Up to ${r.maxActive} sounds from this group play at once` + (r.onFull === 'ignore' ? '; when it is full, your press is ignored.' : '; when it is full, the one that has been playing longest fades out to make room.'));
      if (r.cooldown) parts.push(`After a change, give it ${r.cooldown} seconds before changing it again.`);
      if (r.decay) parts.push(`It fades away by itself after ${r.decay} seconds, unless someone brings it back.`);
      join = parts.join(' ');
    }
    return { sound: def.about || '', slide, join, vol: noPad && !noFader ? 'Use the bar on the right to turn this sound up or down.' : '', noPad, noFader, vote };
  }
  // Tap = open the sheet for this layer: the pad (complexity and filter), a volume fader, the on/off button and a ×, with the explanation behind the pad.
  // The idea is to get people to play one instrument rather than tap every sound once. A swipe does nothing.
  function wirePad(b, id, def) {
    const act = () => {
      if (navigator.vibrate) navigator.vibrate(15);
      const wasOn = new Set(state.active).has(id);
      sheet.open(def, xyState[id] || XY.XY_DEFAULT, wasOn, infoFor(def)); render();
      // Tapping an instrument also brings it in (it can be switched off from the sheet). Not for votes (nature sounds, gong) or layers people cannot toggle.
      if (!wasOn && !isVoteLayer(def) && rulesOfDef(def).r.toggle !== false && !state.finale) { sendMsg({ type: 'toggle', stem: id }); answerTap(id); }
    };
    let g = null; // gesture
    b.addEventListener('pointerdown', (e) => {
      if (g) return;
      b.setPointerCapture(e.pointerId); b.classList.add('pressed');
      g = { pid: e.pointerId, sx: e.clientX, sy: e.clientY, moved: false };
    });
    b.addEventListener('pointermove', (e) => {
      if (!g || e.pointerId !== g.pid || g.moved) return;
      if (Math.hypot(e.clientX - g.sx, e.clientY - g.sy) > TAP_SLOP) { g.moved = true; b.classList.remove('pressed'); }
    });
    const end = (e, cancelled) => {
      if (!g || e.pointerId !== g.pid) return;
      if (!g.moved && !cancelled) act();
      b.classList.remove('pressed');
      g = null;
    };
    b.addEventListener('pointerup', (e) => end(e, false));
    b.addEventListener('pointercancel', (e) => end(e, true));
    b.addEventListener('contextmenu', (e) => e.preventDefault());
    b.addEventListener('keydown', (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); act(); } });
  }

  function build() {
    const groups = (cfg.groups && cfg.groups.length ? cfg.groups : [{ id: null, name: '', badges: [], rules: {} }]).filter((g) => !(g.rules && g.rules.hidden)); // hidden groups (the core synth) are server-controlled: no pads on the phones
    const padHtml = (s) => `
      <div class="pad" role="button" tabindex="0" data-id="${s.id}" style="--c:${s.color || '#888'}" aria-label="${s.name}: tap to play with it">
        <span class="st"></span><span class="name">${s.name}</span><span class="role">${s.role || ''}</span>
      </div>`;
    $('#grid').innerHTML = groups.map((g) => {
      const stems = cfg.stems.filter((s) => (s.group || null) === g.id);
      const head = g.id ? `<div class="gh" title="${(g.badges || []).join(' · ')}"><b>${g.name}</b><span>${(g.badges || []).join(' · ')}</span></div>` : '';
      return `<section class="grp" data-g="${g.id || ''}" style="flex-grow:${Math.max(1, Math.ceil(stems.length / 2))}">${head}<div class="gg">${stems.map(padHtml).join('')}</div></section>`;
    }).join('');
    for (const g of groups) if (g.id && g.rules && g.rules.toggle === false)
      cfg.stems.filter((s) => s.group === g.id).forEach((s) => document.querySelector(`.pad[data-id="${s.id}"]`).classList.add('locked'));
    $('#grid').querySelectorAll('.pad').forEach((b) => {
      const id = Number(b.dataset.id);
      wirePad(b, id, cfg.stems.find((s) => s.id === id));
    });
    $('#beats').innerHTML = '<i></i>'.repeat(cfg.beatsPerBar);
    layout();
    render();
  }

  const isVoteLayer = (sd) => { const r = sd ? rulesOfDef(sd).r : {}; return !!(r.gate || r.finale); };
  // How long a tap can wait before the engine acts on it, in words (the engine tells us its quantize setting).
  function waitWord() {
    const bpb = cfg ? cfg.beatsPerBar || 4 : 4, q = (state.params && state.params.quantizeBar) || (cfg && cfg.quantize === 'bar' ? 1 : cfg && cfg.quantize === 'half' ? 0.5 : 1 / bpb);
    return q >= 0.99 ? 'bar' : q >= 0.45 ? 'half bar' : 'beat';
  }
  // The sheet's switch always shows what is happening: ON/OFF at once, and a line saying what it is waiting for.
  function syncSheet() {
    if (!cfg || sheet.stemId == null) return;
    const a = new Set(state.active), p = new Set(state.playing), sid = sheet.stemId, pd = state.pending && state.pending[sid];
    const sd = cfg.stems.find((x) => x.id === sid), on = a.has(sid), sounding = p.has(sid);
    if (sd && sd.finale) return sheet.setOn(on, on ? 'Struck' : pd ? `${pd.have}/${pd.need} joined` : 'Vote', pd && !on ? 'Waiting for the others to vote…' : null, !!pd && !on);
    if (isVoteLayer(sd)) { /* a layer with a group vote (the nature samples): a Vote button that follows the same stages */
      if (pd && !on) return sheet.setOn(false, `${pd.have}/${pd.need} joined`, 'Waiting for the others to vote…', true);
      if (on && !state.engine) return sheet.setOn(true, 'Stop', 'Waiting for the show to start…', true);
      if (on && !sounding) return sheet.setOn(true, 'Stop', `Starting: waiting for the next ${waitWord()}…`, true);
      if (!on && sounding) return sheet.setOn(false, 'Vote', 'Fading out…', true);
      return sheet.setOn(on, on ? 'Stop' : 'Vote', on ? 'Playing' : null, false);
    }
    if (pd && !on) return sheet.setOn(false, null, `${pd.have}/${pd.need} joined. Waiting for the others…`, true);
    if (on && !state.engine) return sheet.setOn(true, null, 'Waiting for the show to start…', true);
    if (on && !sounding) return sheet.setOn(true, null, `Starting: waiting for the next ${waitWord()}…`, true);
    if (!on && sounding) return sheet.setOn(false, null, 'Fading out…', true);
    sheet.setOn(on, null, on ? 'Playing' : null, false);
  }
  // A tap is answered on the spot, before the server has replied; the real state corrects it a moment later (or at once if the tap was refused).
  let tapTimer = 0;
  function answerTap(id) {
    const sd = cfg.stems.find((x) => x.id === id), on = new Set(state.active).has(id);
    if (sd && sd.finale) sheet.setOn(on, on ? 'Struck' : 'Vote sent…', on ? null : 'Sending your vote…', !on);
    else if (isVoteLayer(sd)) sheet.setOn(!on, on ? 'Stopping…' : 'Vote sent…', on ? 'Fading out…' : 'Sending your vote…', true);
    else sheet.setOn(!on, null, on ? 'Fading out…' : `Starting: waiting for the next ${waitWord()}…`, true);
    clearTimeout(tapTimer); tapTimer = setTimeout(syncSheet, 1500); // no answer: show the real state again
  }

  function render() {
    if (!cfg) return;
    const a = new Set(state.active), p = new Set(state.playing);
    document.body.classList.toggle('finale', !!state.finale); // the end of the show: the grid dims and taps are ignored
    document.querySelectorAll('.pad').forEach((b) => {
      const id = Number(b.dataset.id);
      const s = a.has(id) ? (p.has(id) || !state.engine ? 'playing' : 'starting') : (p.has(id) ? 'stopping' : 'off');
      b.dataset.state = s;
      const pend = state.pending && state.pending[id];
      if (pend && s === 'off') b.dataset.wait = '1'; else delete b.dataset.wait;
      const pl = state.plays && state.plays[id], spent = !!pl && pl.used >= pl.max;
      b.classList.toggle('spent', spent);
      b.querySelector('.st').textContent = pend && s === 'off' ? `${pend.have}/${pend.need} joined` : s === 'off' ? (pl ? (spent ? 'spent' : `${pl.max - pl.used} left`) : '') : s;
    });
    syncSheet();
  }

  let toastTimer = 0;
  function toast(t) { const el = $('#toast'); el.textContent = t; el.classList.add('on'); clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('on'), 2200); }

  function beat(m) {
    document.querySelectorAll('#beats i').forEach((el, i) => el.classList.toggle('on', i === m.beat - 1));
  }

  connect();
})();
</script>
</body>
</html>
